<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rida's Closet - Premium Pakistani Ladies Fashion. Discover elegant lawn, embroidered suits, and stylish ladies wear at affordable prices.">
  <meta name="keywords" content="Pakistani suits, ladies fashion, lawn collection, embroidered suits, eid collection, premium fashion">
  <meta name="author" content="Rida's Closet">
  <meta property="og:title" content="Rida's Closet - Elegant Fashion For Every Occasion">
  <meta property="og:description" content="Premium Pakistani ladies fashion. Lawn, embroidered & luxury suits.">
  <meta property="og:type" content="website">
  <title>Rida's Closet | Premium Pakistani Ladies Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#F3E8EE',
              rose: '#D4A5A5',
              gold: '#C9A96E',
              dark: '#2D2D2D',
              cream: '#FAF7F2'
            }
          },
          fontFamily: {
            display: ['"Playfair Display"', 'serif'],
            body: ['"Inter"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 1s ease-out;
    }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #C9A96E;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
